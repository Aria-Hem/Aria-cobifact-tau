# test_cmb.yaml -- P-ACT lite CMB stack, quick evaluate test
#packages_path: /home/aria-hemmatian/cobaya_packages      # <-- EDIT THIS

theory:
  camb:
    stop_at_error: true
    extra_args:
      kmax: 10
      lens_potential_accuracy: 1

likelihood:
  #bao.desi_dr2: null
  planck_2018_lowl.TT: null
  #planck_2018_lowl.EE_sroll2: null
  act_dr6_cmbonly.PlanckActCut:
    dataset_params:
      use_cl: tt te ee
      lmin_cuts: 0 0 0
      lmax_cuts: 1000 600 600
    params:
      A_planck:
        value: "lambda A_act: A_act"     # tie Planck calibration to ACT's
        latex: A_\mathrm{Planck}
  act_dr6_cmbonly:
    stop_at_error: true
  act_dr6_lenslike:
    lens_only: false
    stop_at_error: true
    lmax: 4000
    variant: actplanck_baseline

params:
  logA:
    prior:
      min: 1.61
      max: 3.91
    ref:
      dist: norm
      loc: 3.05
      scale: 0.001
    proposal: 0.001
    latex: \log(10^{10} A_\mathrm{s})
    drop: true
  As:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
  ns:
    prior:
      min: 0.8
      max: 1.2
    ref:
      dist: norm
      loc: 0.965
      scale: 0.004
    proposal: 0.002
    latex: n_\mathrm{s}
  theta_MC_100:
    prior:
      min: 0.5
      max: 10
    ref:
      dist: norm
      loc: 1.04109
      scale: 0.0004
    proposal: 0.0002
    latex: 100\theta_\mathrm{MC}
    drop: true
    renames: theta
  cosmomc_theta:
    value: 'lambda theta_MC_100: 1.e-2*theta_MC_100'
    derived: false
  H0:
    latex: H_0
    min: 20
    max: 100
  ombh2:
    prior:
      min: 0.005
      max: 0.1
    ref:
      dist: norm
      loc: 0.0224
      scale: 0.0001
    proposal: 0.0001
    latex: \Omega_\mathrm{b} h^2
  omch2:
    prior:
      min: 0.001
      max: 0.99
    ref:
      dist: norm
      loc: 0.12
      scale: 0.001
    proposal: 0.0005
    latex: \Omega_\mathrm{c} h^2
  omegam:
    latex: \Omega_\mathrm{m}
  omegamh2:
    derived: 'lambda omegam, H0: omegam*(H0/100)**2'
    latex: \Omega_\mathrm{m} h^2
  mnu: 0.06
  omega_de:
    latex: \Omega_\Lambda
  tau:
    prior:
      dist: norm
      loc: 0.09 # (0.05,0.06.....)
      scale: 0.0073
    ref:
      dist: norm
      loc: 0.0544
      scale: 0.0073
    latex: \tau_\mathrm{reio}
  A:
    derived: 'lambda As: 1e9*As'
    latex: 10^9 A_\mathrm{s}
  rdrag:
    latex: r_\mathrm{d}
  H0rd:
    derived: 'lambda rdrag, H0: rdrag*(H0/100)'
    latex: H_0 r_\mathrm{d}

sampler:
  mcmc:
    Rminus1_stop: 0.03          # convergence target on the means
    Rminus1_cl_stop: 0.2        # convergence on the 95% bounds (see gotcha below)
    max_tries: 1000

output: chains/CMB_0.09/chain 