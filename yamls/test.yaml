
theory:
  camb:
    stop_at_error: true
    extra_args:
      kmax: 10
      lens_potential_accuracy: 1

likelihood:
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE_sroll2: null
  act_dr6_cmbonly.PlanckActCut:
    dataset_params:
      use_cl: tt te ee
      lmin_cuts: 0 0 0
      lmax_cuts: 1000 600 600
    params:
      A_planck:
        value: "lambda A_act: A_act"     # tie Planck calibration to ACT's
        latex: A_\mathrm{Planck}
  act_dr6_cmbonly:
    stop_at_error: true
  act_dr6_lenslike:
    lens_only: false
    stop_at_error: true
    lmax: 4000
    variant: actplanck_baseline

params:
  # --- cosmology (LCDM) ---
  # NB: any latex with { } braces sits inside a { } flow mapping here, so it
  # MUST be quoted (single quotes = literal, no escaping needed). See gotchas.
  logA:   {value: 3.05, drop: true, latex: '\log(10^{10} A_\mathrm{s})'}
  As:     {value: 'lambda logA: 1e-10*np.exp(logA)', latex: 'A_\mathrm{s}'}
  ns:     0.965
  ombh2:  0.02237
  omch2:  0.1200
  H0:     67.36
  tau:    0.0544
  # --- ACT nuisance params ---
  A_act:  {value: 1.0, latex: 'A_\mathrm{ACT}'}
  P_act:  {value: 1.0, latex: 'P_\mathrm{ACT}'}

sampler:
  evaluate: null     # just evaluate the posterior once at the params above
