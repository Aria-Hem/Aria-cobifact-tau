theory:
  camb:
    version: 1.6.5
    path: null
    speed: 0.3
    stop_at_error: false
    extra_args:
      dark_energy_model: ppf
      kmax: 10
      lens_potential_accuracy: 1
      num_massive_neutrinos: 1
      nnu: 3.044
    ignore_obsolete: false
    external_primordial_pk: false
    renames:
      omegabh2: ombh2
      omegach2: omch2
      omegal: omega_de
      omegak: omk
      yhe: YHe
      yheused: YHe
      YpBBN: Y_p
    params:
      H0:
        latex: H_0
        derived: true
      thetastar:
        latex: \theta_\star
        derived: true
      sigma8:
        latex: \sigma_8
        derived: true
      YHe:
        latex: Y_\mathrm{He}
        derived: true
      zrei:
        latex: z_\mathrm{reio}
        derived: true
      zstar:
        latex: z_\star
        derived: true
      rstar:
        latex: r_{s,\star}
        derived: true
      zdrag:
        latex: z_d
        derived: true
    input_params:
    - As
    - ns
    - ombh2
    - omch2
    - cosmomc_theta
    - tau
    - w
    - wa
    - mnu
    output_params:
    - omegam
    - H0
    - thetastar
    - sigma8
    - YHe
    - zrei
    - zstar
    - rstar
    - zdrag
likelihood:
  bao.generic:
    measurements_file: /home/aria-hemmatian/Desktop/test2/bao_fake_v2/myBAO_022_wN.dat
    cov_file: /home/aria-hemmatian/Desktop/Um-project/bao_fake/cov/myBAO.cov
    invcov_file: /full/path/to/myBAO_inv.cov
    rs_fid: null
    speed: 2500
    type: BAO
    rs_rescale: null
    prob_dist: null
    redshift: null
    observable_1: null
    observable_2: null
    observable_3: null
    grid_file: null
    stop_at_error: false
    version: null
    input_params: []
    output_params: []
  planck_2018_lowl.TT:
    lmin: 2
    lmax: 29
    type: CMB
    aliases:
    - lowT
    speed: -1
    stop_at_error: false
    version: null
    input_params:
    - A_planck
    output_params: []
  act_dr6_cmbonly.PlanckActCut:
    path: null
    dataset_file: plik_lite_v22.dataset
    dataset_params:
      use_cl: tt te ee
      lmin_cuts: 0 0 0
      lmax_cuts: 1000 600 600
    aliases:
    - plikHM_TTTEEE
    speed: 200
    type: CMB
    stop_at_error: false
    version: null
    input_params:
    - A_planck
    output_params: []
  act_dr6_cmbonly:
    url: https://lambda.gsfc.nasa.gov/data/act/pspipe/sacc_files/
    input_file: dr6_data_cmbonly.fits
    data_folder: ACTDR6CMBonly
    version: v1.0
    ell_cuts:
      TT:
      - 600
      - 6500
      TE:
      - 600
      - 6500
      EE:
      - 600
      - 6500
    lmax_theory: 9000
    type: []
    speed: -1
    stop_at_error: true
    input_params:
    - A_act
    - P_act
    output_params: []
  act_dr6_lenslike:
    lmax: 4000
    mock: false
    nsims_act: 792.0
    nsims_planck: 400.0
    no_like_corrections: false
    no_actlike_cmb_corrections: false
    lens_only: false
    trim_lmax: 2998
