theory:
  camb:
    extra_args:
      dark_energy_model: ppf
      num_massive_neutrinos: 1
      nnu: 3.044
likelihood:
  bao.generic:
    measurements_file: /home/aria-hemmatian/Desktop/Um-project/bao_fake_v2/myBAO_000_wN.dat
    cov_file: /home/aria-hemmatian/Desktop/Um-project/bao_fake/cov/myBAO.cov
  external_class:
    class: CMB_Compressd.CMB_compressed_fixed_zstar
    python_path: /home/aria-hemmatian/cobaya-packages/data
params:
  H0:
    prior:
      min: 20
      max: 100
    ref:
      dist: norm
      loc: 67.8
      scale: 2
    proposal: 2
    latex: H_0
  ombh2:
    prior:
      max: 0.1
      min: 0.005
    ref:
      dist: norm
      loc: 0.0222
      scale: 0.0005
    proposal: 0.0004
    latex: \Omega_\mathrm{b} h^2
  omch2:
    prior:
      max: 0.99
      min: 0.001
    ref:
      dist: norm
      loc: 0.12
      scale: 0.003
    proposal: 0.002
    latex: \Omega_\mathrm{c} h^2
  omegam:
    latex: \Omega_\mathrm{m}
  omegamh2:
    derived: 'lambda omegam, H0: omegam*(H0/100)**2'
    latex: \Omega_\mathrm{m} h^2
  rdrag:
    latex: r_\mathrm{d}
  H0rd:
    derived: 'lambda rdrag, H0: rdrag*(H0/100)'
    latex: H_0 r_\mathrm{d}
sampler:
  minimize:
    method: iminuit
    best_of: 4
    ignore_prior: true
output: chain
